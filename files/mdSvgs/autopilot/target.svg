<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
<title id="title">Move to the target and face its heading</title>
<desc id="desc">Top view. A robot at one meter, three meters moves right toward the target at two meters, three meters. The target robot faces up, a heading of ninety degrees.</desc>
<defs>
<marker id="move" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
<marker id="heading" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c2410c"/></marker>
<g id="robot">
<rect x="-40" y="-48" width="80" height="96" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
<g fill="#334155"><rect x="-47" y="-36" width="14" height="25" rx="3"/><rect x="33" y="-36" width="14" height="25" rx="3"/><rect x="-47" y="11" width="14" height="25" rx="3"/><rect x="33" y="11" width="14" height="25" rx="3"/></g>
<path d="M-10 -27L0 -37L10 -27" fill="none" stroke="#475569" stroke-width="3"/>
</g>
</defs>
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
<text x="320" y="28" font-size="18" font-weight="bold">Top view</text>
<use href="#robot" transform="translate(140 165) rotate(90)"/>
<use href="#robot" transform="translate(480 165)"/>
<path d="M215 165H400" stroke="#2563eb" stroke-width="4" marker-end="url(#move)"/>
<text x="308" y="145" font-size="16" fill="#2563eb">Move toward target</text>
<path d="M480 114V62" stroke="#c2410c" stroke-width="4" marker-end="url(#heading)"/>
<text x="566" y="78" font-size="16" fill="#c2410c">90° heading</text>
<text x="140" y="239" font-size="16">Current robot</text><text x="140" y="263" font-size="14">Example: (1, 3)</text>
<text x="480" y="239" font-size="16">Target robot</text><text x="480" y="263" font-size="14">(2, 3), facing up</text>
</g></svg>
