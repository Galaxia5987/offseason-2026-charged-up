<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Position tolerance of two centimeters and heading tolerance of one degree</title><desc id="desc">Magnified target area shows an accepted pose within two centimeters and a heading between 89 and 91 degrees.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs>
<rect width="640" height="320" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a" font-size="15">
<text x="24" y="28" font-size="18" font-weight="bold">Close enough: 2 cm and 1°</text>
<circle cx="160" cy="160" r="80" fill="#dcfce7" stroke="#15803d" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M150 160H170M160 150V170" stroke="#475569" stroke-width="2"/>
<path d="M160 160H240" stroke="#15803d" stroke-width="2"/><text x="190" y="150">2 cm</text>
<rect x="171" y="118" width="24" height="30" rx="4" fill="#e2e8f0" stroke="#475569"/><text x="65" y="275">Position inside the green circle</text>
<path d="M445 240V70" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M445 240L442 70M445 240L448 70" stroke="#15803d" stroke-width="2" stroke-dasharray="4 4"/>
<circle cx="445" cy="240" r="5" fill="#475569"/>
<text x="405" y="55">90° target</text><text x="355" y="155">91°</text><text x="485" y="155">89°</text>
<text x="350" y="275">Heading within 1° of the target</text>
<text x="24" y="305" font-size="13">Magnified tolerance examples · both conditions must pass</text></g></svg>
