<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
<title id="title">Calculated movement toward the target</title><desc id="desc">From the origin toward two meters, three meters, the velocity points up and right. Desired heading is 90 degrees.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs>
<rect width="640" height="320" rx="12" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a" font-size="15">
<text x="24" y="28" font-size="18" font-weight="bold">Movement toward the target</text>
<path d="M90 60V245H300" stroke="#475569" stroke-width="2" fill="none"/>
<path d="M90 245L210 65" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="195" y="50" width="30" height="30" rx="5" fill="#dcfce7" stroke="#15803d"/>
<text x="230" y="70">Target (2, 3)</text>
<rect x="75" y="230" width="30" height="30" rx="5" fill="#e2e8f0" stroke="#475569"/>
<path d="M90 245L150 155" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M90 245H150V155" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="4 4"/>
<text x="105" y="282">+vx</text><text x="165" y="205">+vy</text>
<text x="350" y="135">vx: movement along x</text><text x="350" y="165">vy: movement along y</text><text x="350" y="205">targetAngle = 90°</text>
<text x="24" y="310" font-size="13">Example robot at (0, 0) · target at (2, 3)</text></g></svg>
