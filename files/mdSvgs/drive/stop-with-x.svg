<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Normal stop and X stop</title>
  <desc id="desc">Normal stop requests zero velocity. X stop also points all four wheels along the diagonals of the chassis to resist movement.</desc>
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="170" y="36" font-size="20" font-weight="bold">stop()</text>
    <text x="470" y="36" font-size="20" font-weight="bold">stopWithX()</text>
    <g fill="#e2e8f0" stroke="#475569" stroke-width="2">
      <rect x="105" y="65" width="130" height="150" rx="14"/>
      <rect x="405" y="65" width="130" height="150" rx="14"/>
    </g>
    <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5">
      <path d="M412 82L528 198M528 82L412 198"/>
    </g>
    <g fill="#334155">
      <rect x="96" y="75" width="22" height="42" rx="5"/>
      <rect x="222" y="75" width="22" height="42" rx="5"/>
      <rect x="96" y="163" width="22" height="42" rx="5"/>
      <rect x="222" y="163" width="22" height="42" rx="5"/>
      <rect x="401" y="69" width="22" height="42" rx="5" transform="rotate(-45 412 90)"/>
      <rect x="517" y="69" width="22" height="42" rx="5" transform="rotate(45 528 90)"/>
      <rect x="401" y="169" width="22" height="42" rx="5" transform="rotate(45 412 190)"/>
      <rect x="517" y="169" width="22" height="42" rx="5" transform="rotate(-45 528 190)"/>
    </g>
    <text x="170" y="143" font-size="14">Zero velocity</text>
    <text x="470" y="143" font-size="14">Zero velocity</text>
    <text x="170" y="252" font-size="14">Wheel angles shown as an example</text>
    <text x="470" y="252" font-size="14">Wheels form an X to resist movement</text>
    <text x="320" y="282" font-size="13" fill="#475569">Top view · front points up</text>
  </g>
</svg>
