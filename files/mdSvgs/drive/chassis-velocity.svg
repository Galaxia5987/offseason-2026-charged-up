<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Chassis velocity directions</title>
  <desc id="desc">Robot viewed from above with its front pointing up. Positive vx points forward, positive vy points left, and positive omega turns counterclockwise.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle">
    <text x="320" y="28" font-size="18" font-weight="bold">Top view · robot-relative movement</text>
    <rect x="250" y="132" width="140" height="160" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <g fill="#334155">
      <rect x="237" y="146" width="22" height="42" rx="5"/>
      <rect x="381" y="146" width="22" height="42" rx="5"/>
      <rect x="237" y="239" width="22" height="42" rx="5"/>
      <rect x="381" y="239" width="22" height="42" rx="5"/>
    </g>
    <text x="320" y="158" font-size="14">FRONT</text>
    <circle cx="320" cy="212" r="5" fill="#2563eb"/>
    <g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#blue)">
      <path d="M320 212V66"/>
      <path d="M320 212H110"/>
    </g>
    <text x="373" y="83" font-size="18" fill="#2563eb">+vx</text>
    <text x="373" y="104" font-size="14">forward</text>
    <text x="145" y="186" font-size="18" fill="#2563eb">+vy</text>
    <text x="145" y="244" font-size="14">left</text>
    <path d="M438 268 A135 135 0 0 0 432 132" fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#orange)"/>
    <text x="528" y="190" font-size="18" fill="#c2410c">+omega</text>
    <text x="528" y="214" font-size="14">counterclockwise</text>
    <text x="320" y="333" font-size="14">vx, vy: m/s · omega: rad/s</text>
  </g>
</svg>
