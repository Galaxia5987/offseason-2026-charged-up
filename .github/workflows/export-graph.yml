name: Export Drawio Diagrams

on:
  push:
    paths:
      - 'files/**/*.drawio'
  pull_request:
    paths:
      - 'files/**/*.drawio'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Export Draw.io diagrams to SVG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: files
          format: svg
          
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'files/**/*.svg'
          commit_message: Update diagrams
